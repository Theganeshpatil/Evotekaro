name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Lint with Ruff
      run: |
        ruff check evotekaro/ || true
    - name: Test with pytest
      run: |
        PYTHONPATH=. pytest
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '26'
    - name: Frontend build
      working-directory: ./frontend
      run: |
        npm ci
        npm run build
